# ============================================================================
# Build the site and publish it to GitHub Pages.
#
# BASE_PATH is derived from the repo name, so a project page serves correctly
# without anyone editing vite.config.ts. When the custom domain lands, add a
# public/CNAME file and change this to `/` — nothing else moves.
#
# The build runs `vue-tsc --noEmit` first, so a type error fails the deploy
# instead of shipping. postbuild.mjs writes dist/404.html, which is what makes
# deep links survive a cold load on Pages.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Requires package-lock.json to be committed.
      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
