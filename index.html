<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- PRE-LAUNCH ONLY — DELETE THIS LINE AT LAUNCH.
         On a GitHub Pages *project* page the site lives under /<repo>/, and
         crawlers only read robots.txt at the domain root — which belongs to
         the user page, not this repo. So public/robots.txt is inert until the
         custom domain lands, and this tag is what actually keeps 116
         [PLACEHOLDER] strings out of the index. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Singularity.exe — a deterministic card game by Octothorpe</title>
    <meta
      name="description"
      content="Humans abandoned physical reality. What remains fights for control of one legendary program - the Singularity. A deterministic card game for 1–4 players."
    />
    <!-- %BASE_URL% is substituted by Vite, so these follow BASE_PATH and keep
         working on a project page, a user page and a custom domain alike. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
